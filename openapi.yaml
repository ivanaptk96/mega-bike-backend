openapi: 3.1.0
info:
  title: Mega Bike API
  version: 0.0.1
  description: |
    API contract for the Mega Bike backend.

    Current implementation status:
    - POST /api/auth/login is implemented.
    - POST /api/auth/refresh is implemented.
    - POST /api/auth/logout is implemented.
    - GET /api/auth/me is implemented.
    - Category CRUD endpoints are implemented.
    - Product CRUD and paged product listing/search endpoints are implemented.
    - Inventory listing, product inventory lookup, movement history, and manual stock adjustment endpoints are implemented.
    - Supplier CRUD, supplier-product mapping, and Planet Bike downloaded CSV import endpoints are implemented.
    - JWT access tokens are created on login.
    - Incoming bearer-token validation is implemented.
    - Local Docker PostgreSQL is exposed on localhost:5433.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Auth
    description: Authentication endpoints
  - name: Catalog
    description: Catalog endpoints
  - name: Inventory
    description: Inventory and stock endpoints
  - name: Suppliers
    description: Supplier and supplier import endpoints
paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Log in
      description: Authenticates a user with email and password and returns a signed JWT access token.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              admin:
                summary: Dev admin login
                value:
                  email: admin@megabike.local
                  password: password
              manager:
                summary: Dev manager login
                value:
                  email: manager@megabike.local
                  password: password
              employee:
                summary: Dev employee login
                value:
                  email: employee@megabike.local
                  password: password
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                    refreshToken: VcJKgk9jY7wFMV6zvJ4p5W7t8wz7qH0m4CO3LQ
                    tokenType: Bearer
                    expiresInSeconds: 900
                    expiresAt: '2026-07-10T10:00:00Z'
                    refreshTokenExpiresAt: '2026-07-17T10:00:00Z'
                    email: admin@megabike.local
                    authorities:
                      - PRODUCT_READ
                      - PRODUCT_WRITE
                      - ROLE_ADMIN
                      - USER_MANAGE
        '400':
          description: Request body validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCredentials:
                  value:
                    code: INVALID_CREDENTIALS
                    message: Invalid credentials.
  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Issues a new access token from a valid, unexpired, non-revoked refresh token.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Request body validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid, expired, or revoked refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Log out
      description: Revokes a refresh token. Requires a valid bearer access token.
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '400':
          description: Request body validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing, invalid, or expired bearer token.
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Get current user
      description: Returns the currently authenticated user from the bearer access token.
      operationId: currentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
              examples:
                admin:
                  value:
                    email: admin@megabike.local
                    authorities:
                      - PRODUCT_READ
                      - PRODUCT_WRITE
                      - ROLE_ADMIN
                      - USER_MANAGE
        '401':
          description: Missing, invalid, or expired bearer token.
  /api/internal/categories:
    post:
      tags:
        - Catalog
      summary: Create category
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Request body validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing PRODUCT_WRITE authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Category slug already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Catalog
      summary: List categories
      operationId: listCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categories ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing PRODUCT_READ authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/internal/categories/{id}:
    get:
      tags:
        - Catalog
      summary: Get category
      operationId: getCategory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          description: Category was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Catalog
      summary: Update category
      operationId: updateCategory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Request body validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing PRODUCT_WRITE authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Category slug already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/internal/products:
    post:
      tags:
        - Catalog
      summary: Create product
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Request body validation failed or category was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing PRODUCT_WRITE authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Product code or barcode already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Catalog
      summary: List products
      description: Searches by name, productCode, barcode, brandName, and externalId. Returns a stable paged response wrapper.
      operationId: listProducts
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size. Must be between 1 and 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: name
            enum:
              - name
              - productCode
              - brandName
              - retailPrice
              - createdAt
              - active
        - name: direction
          in: query
          required: false
          schema:
            type: string
            default: asc
            enum:
              - asc
              - desc
      responses:
        '200':
          description: Paged products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPageResponse'
        '400':
          description: Invalid pagination or sorting request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing PRODUCT_READ authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/internal/products/{id}:
    get:
      tags:
        - Catalog
      summary: Get product
      operationId: getProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing PRODUCT_READ authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Catalog
      summary: Update product
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Request body validation failed or category was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing PRODUCT_WRITE authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Product code or barcode already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/internal/inventory:
    get:
      tags:
        - Inventory
      summary: List inventory
      description: Lists inventory items with current quantity by product and stock location.
      operationId: listInventory
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          description: Searches product name, productCode, and barcode.
          schema:
            type: string
        - name: stockLocationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paged inventory items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPageResponse'
        '400':
          description: Invalid pagination request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing STOCK_RECEIVE authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/internal/inventory/products/{productId}:
    get:
      tags:
        - Inventory
      summary: Get product inventory
      operationId: getProductInventory
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: stockLocationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inventory item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing STOCK_RECEIVE authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Inventory item was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/internal/inventory/movements:
    get:
      tags:
        - Inventory
      summary: List stock movements
      description: Lists stock movement audit history ordered newest first.
      operationId: listStockMovements
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: stockLocationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: movementType
          in: query
          required: false
          schema:
            type: string
            enum:
              - ADJUSTMENT
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paged stock movements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementPageResponse'
        '400':
          description: Invalid pagination request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing STOCK_RECEIVE authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/internal/inventory/products/{productId}/movements:
    get:
      tags:
        - Inventory
      summary: List product stock movements
      description: Lists stock movement audit history for one product ordered newest first.
      operationId: listProductStockMovements
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: stockLocationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: movementType
          in: query
          required: false
          schema:
            type: string
            enum:
              - ADJUSTMENT
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paged product stock movements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementPageResponse'
        '400':
          description: Invalid pagination request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing STOCK_RECEIVE authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/internal/inventory/adjustments:
    post:
      tags:
        - Inventory
      summary: Create stock adjustment
      description: Applies a manual stock quantity adjustment and records a stock movement.
      operationId: createStockAdjustment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
      responses:
        '200':
          description: Stock adjustment recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementResponse'
        '400':
          description: Request body validation failed or adjustment would make stock negative.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing STOCK_ADJUST authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/internal/suppliers:
    post:
      tags:
        - Suppliers
      summary: Create supplier
      operationId: createSupplier
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRequest'
      responses:
        '200':
          description: Supplier created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '400':
          description: Request body validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing SUPPLIER_MANAGE authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Supplier code already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Suppliers
      summary: List suppliers
      operationId: listSuppliers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Suppliers ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupplierResponse'
        '403':
          description: Missing SUPPLIER_MANAGE authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/internal/suppliers/{id}:
    get:
      tags:
        - Suppliers
      summary: Get supplier
      operationId: getSupplier
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Supplier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '404':
          description: Supplier was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Suppliers
      summary: Update supplier
      operationId: updateSupplier
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRequest'
      responses:
        '200':
          description: Supplier updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '400':
          description: Request body validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Supplier was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Supplier code already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/internal/supplier-products:
    post:
      tags:
        - Suppliers
      summary: Create supplier product
      operationId: createSupplierProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierProductRequest'
      responses:
        '200':
          description: Supplier product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierProductResponse'
        '400':
          description: Request body validation failed or linked internal product was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing SUPPLIER_MANAGE authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Supplier product code already exists for this supplier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Suppliers
      summary: List supplier products
      operationId: listSupplierProducts
      security:
        - bearerAuth: []
      parameters:
        - name: supplierId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paged supplier products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierProductPageResponse'
        '403':
          description: Missing SUPPLIER_MANAGE authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/internal/supplier-products/{id}:
    get:
      tags:
        - Suppliers
      summary: Get supplier product
      operationId: getSupplierProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Supplier product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierProductResponse'
        '404':
          description: Supplier product was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Suppliers
      summary: Update supplier product
      operationId: updateSupplierProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierProductRequest'
      responses:
        '200':
          description: Supplier product updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierProductResponse'
        '400':
          description: Request body validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Supplier product was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Supplier product code already exists for this supplier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/internal/suppliers/{supplierId}/imports:
    post:
      tags:
        - Suppliers
      summary: Import downloaded Planet Bike Lager Lista CSV
      description: Uploads a CSV previously downloaded from Planet Bike B2B documents. The backend imports supplier availability and price snapshots; it does not download from Planet Bike automatically and does not update Mega Bike inventory.
      operationId: importSupplierCsv
      security:
        - bearerAuth: []
      parameters:
        - name: supplierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import run completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierImportRunResponse'
        '400':
          description: File is empty, unsupported supplier, or CSV could not be parsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing SUPPLIER_MANAGE authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Suppliers
      summary: List supplier import runs
      operationId: listSupplierImports
      security:
        - bearerAuth: []
      parameters:
        - name: supplierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Supplier import runs ordered newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupplierImportRunResponse'
  /api/internal/supplier-imports/{importRunId}:
    get:
      tags:
        - Suppliers
      summary: Get supplier import run
      operationId: getSupplierImport
      security:
        - bearerAuth: []
      parameters:
        - name: importRunId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Supplier import run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierImportRunResponse'
        '404':
          description: Supplier import was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/internal/supplier-imports/{importRunId}/issues:
    get:
      tags:
        - Suppliers
      summary: List supplier import issues
      operationId: listSupplierImportIssues
      security:
        - bearerAuth: []
      parameters:
        - name: importRunId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Supplier import issues ordered by CSV row number.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupplierImportIssueResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: admin@megabike.local
        password:
          type: string
          format: password
          example: password
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresInSeconds
        - expiresAt
        - refreshTokenExpiresAt
        - email
        - authorities
      properties:
        accessToken:
          type: string
          description: Signed JWT access token.
        refreshToken:
          type: string
          description: Opaque refresh token. Store securely; the database stores only its SHA-256 hash.
        tokenType:
          type: string
          enum:
            - Bearer
        expiresInSeconds:
          type: integer
          format: int64
          example: 900
        expiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
        email:
          type: string
          format: email
        authorities:
          type: array
          items:
            type: string
          example:
            - ROLE_ADMIN
            - PRODUCT_READ
            - PRODUCT_WRITE
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresInSeconds
        - expiresAt
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresInSeconds:
          type: integer
          format: int64
          example: 900
        expiresAt:
          type: string
          format: date-time
    LogoutResponse:
      type: object
      additionalProperties: false
      required:
        - revoked
      properties:
        revoked:
          type: boolean
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required:
        - email
        - authorities
      properties:
        email:
          type: string
          format: email
        authorities:
          type: array
          items:
            type: string
          example:
            - ROLE_ADMIN
            - PRODUCT_READ
            - PRODUCT_WRITE
    CategoryRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - active
      properties:
        name:
          type: string
          maxLength: 200
          example: Helmets
        slug:
          type: string
          maxLength: 220
          nullable: true
          example: helmets
        parentId:
          type: string
          format: uuid
          nullable: true
        active:
          type: boolean
          example: true
    CategoryResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - active
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Helmets
        slug:
          type: string
          example: helmets
        parentId:
          type: string
          format: uuid
          nullable: true
        parentName:
          type: string
          nullable: true
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    ProductRequest:
      type: object
      additionalProperties: false
      required:
        - productCode
        - name
        - categoryId
        - unit
        - purchasePrice
        - retailPrice
        - vatRate
        - retailPriceIncludesVat
        - active
      properties:
        productCode:
          type: string
          maxLength: 50
          example: MB-P-1001
        externalId:
          type: string
          maxLength: 120
          nullable: true
          example: ALG-P-1001
        barcode:
          type: string
          maxLength: 64
          nullable: true
          example: '8600000001001'
        name:
          type: string
          maxLength: 240
          example: Trail Helmet M
        description:
          type: string
          maxLength: 2000
          nullable: true
        brandName:
          type: string
          maxLength: 160
          nullable: true
          example: Mega Bike
        categoryId:
          type: string
          format: uuid
        unit:
          type: string
          enum:
            - PIECE
        purchasePrice:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 38.00
        retailPrice:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 59.99
        vatRate:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
          example: 20.00
